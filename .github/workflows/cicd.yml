name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'practice-app/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/practice-app:${{ github.sha }} ./practice-app
        docker push ${{ secrets.DOCKER_USERNAME }}/practice-app:${{ github.sha }}

    - name: Deploy to Kubernetes
      uses: actions-hub/kubectl@master
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      with:
        args: set image deployment/nginx-deployment nginx-container=${{ secrets.DOCKER_USERNAME }}/practice-app:${{ github.sha }} -n nginx

    - name: Verify Deployment
      uses: actions-hub/kubectl@master
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      with:
        args: rollout status deployment/nginx-deployment -n nginx --timeout=60s

    - name: Rollback on Failure
      if: failure()
      uses: actions-hub/kubectl@master
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      with:
        args: rollout undo deployment/nginx-deployment -n nginx
