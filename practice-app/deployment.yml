apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-app
  namespace: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: practice-app
  template:
    metadata:
      labels:
        app: practice-app
    spec:
      containers:
      - name: practice-app
        image: swarup182000/practice-app:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: practice-app-service
  namespace: nginx
spec:
  type: NodePort
  selector:
    app: practice-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 31000
